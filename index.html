const INCOTERM_EXPECTED_RESPONSIBILITY = {
  EXW: "buyer_pays_freight", FCA: "buyer_pays_freight", FAS: "buyer_pays_freight", FOB: "buyer_pays_freight",
  CFR: "seller_pays_freight_insurance", CPT: "seller_pays_freight_insurance", CIF: "seller_pays_freight_insurance",
  CIP: "seller_pays_freight_insurance", DAP: "seller_pays_freight_insurance", DPU: "seller_pays_freight_insurance",
  DDP: "seller_pays_freight_insurance",
};

function sumQty(items) { return (items || []).reduce((s, i) => s + (Number(i.qty) || 0), 0); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function labelResponsibility(code) { return code === "buyer_pays_freight" ? "ผู้ซื้อรับผิดชอบค่าขนส่ง" : "ผู้ขายรับผิดชอบค่าขนส่ง/ประกันภัย"; }

function checkQtyMismatch(s) {
  const invQty = sumQty(s.invoice?.items), pkQty = sumQty(s.packingList?.items);
  if (invQty !== pkQty) return {
    tag: "qty_mismatch", severity: "high",
    message: `จำนวนสินค้าใน Invoice (${invQty}) ไม่ตรงกับ Packing List (${pkQty})`,
    reasoning: "เปรียบเทียบจำนวนรวมของสินค้าทุกรายการใน invoice กับ packing list",
    suggestedFix: "ตรวจสอบว่ามีการแก้ไขจำนวนหลังตัดตู้แล้วหรือไม่ และแก้ไขให้ตัวเลขตรงกันทั้งสองเอกสาร",
    responsibleParty: s.responsibleParty || "ยังไม่มอบหมายผู้รับผิดชอบ", estimatedDelayDays: 2,
  };
  return null;
}
function checkMissingCOO(s) {
  const c = s.certificateOfOrigin;
  if (c?.required && !c?.provided) return {
    tag: "missing_coo", severity: "high",
    message: "ขาดเอกสาร Certificate of Origin", reasoning: "certificateOfOrigin.required = true แต่ยังไม่ provided",
    suggestedFix: "ยื่นขอ Certificate of Origin จากหน่วยงานที่เกี่ยวข้องก่อนปิดตู้",
    responsibleParty: s.responsibleParty || "ยังไม่มอบหมายผู้รับผิดชอบ", estimatedDelayDays: 5,
  };
  return null;
}
function checkVagueDescription(s) {
  const items = s.invoice?.items || [];
  const vague = items.filter((i) => !i.hsCode);
  if (vague.length) return {
    tag: "vague_description", severity: "medium",
    message: `คำอธิบายสินค้า "${vague[0].productNameEN}" กว้างเกินไป ระบุ HS code ไม่ได้`,
    reasoning: "รายการสินค้านี้ไม่มี HS code ระบุไว้",
    suggestedFix: "ระบุวัสดุ/ส่วนประกอบ/การใช้งานของสินค้าให้เจาะจงขึ้น",
    responsibleParty: s.responsibleParty || "ยังไม่มอบหมายผู้รับผิดชอบ", estimatedDelayDays: 3,
  };
  return null;
}
function checkWeightError(s) {
  const items = s.packingList?.items || [];
  const bad = items.find((i) => i.grossWeightKg < i.netWeightKg);
  if (bad) return {
    tag: "weight_error", severity: "high",
    message: `น้ำหนักรวม (${bad.grossWeightKg}kg) น้อยกว่าน้ำหนักสุทธิ (${bad.netWeightKg}kg)`,
    reasoning: "Gross weight ต้อง ≥ Net weight เสมอ",
    suggestedFix: "ตรวจสอบตัวเลขจากใบชั่งจริงอีกครั้ง อาจกรอกตัวเลขสลับกัน",
    responsibleParty: s.responsibleParty || "ยังไม่มอบหมายผู้รับผิดชอบ", estimatedDelayDays: 2,
  };
  return null;
}
function checkIncotermConflict(s) {
  const exp = INCOTERM_EXPECTED_RESPONSIBILITY[s.incoterm];
  if (exp && s.costResponsibility && exp !== s.costResponsibility) return {
    tag: "incoterm_conflict", severity: "medium",
    message: `Incoterm "${s.incoterm}" ปกติควรให้ ${labelResponsibility(exp)} แต่ระบุว่า ${labelResponsibility(s.costResponsibility)}`,
    reasoning: "เทียบภาระค่าใช้จ่ายที่กรอก กับหลักการทั่วไปของ Incoterm ที่เลือก",
    suggestedFix: "ตรวจสอบกับคู่ค้าว่าจริงๆแล้วตกลงกันด้วย Incoterm ใด หรือแก้ไขภาระค่าใช้จ่ายให้ตรงกัน",
    responsibleParty: s.responsibleParty || "ยังไม่มอบหมายผู้รับผิดชอบ", estimatedDelayDays: 1,
  };
  return null;
}
function checkMissingPermit(s) {
  const p = s.permitsOrCertificates;
  if (p?.required && !p?.provided) return {
    tag: "missing_permit", severity: "medium",
    message: `ขาดเอกสาร ${p.type || "ใบอนุญาต/ใบรับรองสินค้า"}`,
    reasoning: "permitsOrCertificates.required = true แต่ยังไม่ provided",
    suggestedFix: `ยื่นขอ ${p.type || "ใบอนุญาต/ใบรับรองสินค้า"} จากหน่วยงานที่เกี่ยวข้อง`,
    responsibleParty: s.responsibleParty || "ยังไม่มอบหมายผู้รับผิดชอบ", estimatedDelayDays: 4,
  };
  return null;
}

function runAllChecks(s) {
  return [checkQtyMismatch, checkMissingCOO, checkVagueDescription, checkWeightError, checkIncotermConflict, checkMissingPermit]
    .map((fn) => fn(s)).filter(Boolean);
}

function calculateCompleteness(s) {
  const req = [
    !!s.po?.poNumber, !!s.invoice?.invoiceNo, (s.invoice?.items?.length || 0) > 0, (s.packingList?.items?.length || 0) > 0,
    !!s.billOfLading?.number, s.certificateOfOrigin?.required ? !!s.certificateOfOrigin?.provided : true,
    s.permitsOrCertificates?.required ? !!s.permitsOrCertificates?.provided : true, !!s.responsibleParty,
  ];
  return Math.round((req.filter(Boolean).length / req.length) * 100);
}

function calculateRisk(s) {
  const findings = runAllChecks(s);
  const w = { high: 25, medium: 15, low: 5 };
  let score = findings.reduce((sum, f) => sum + (w[f.severity] || 10), 0);
  if (s.scenarioType === "urgent") score += 15;
  if (s.scenarioType === "incomplete") score += 10;
  const days = daysBetween(s.createdAt, s.deadline);
  if (days <= 3) score += 15; else if (days <= 7) score += 5;
  score = Math.min(score, 100);
  let level = "low"; if (score >= 60) level = "high"; else if (score >= 30) level = "medium";
  return { score, level, findings, daysAvailable: days };
}

const HS_CATEGORY_TABLE = [
  { keywords: ["dried", "durian", "mango", "banana", "mangosteen", "longan"], categoryTH: "ผลไม้แปรรูป/อบแห้ง", hsChapter: "08", sampleHsCode: "0813.40" },
  { keywords: ["rice"], categoryTH: "ข้าวและธัญพืช", hsChapter: "10", sampleHsCode: "1006.30" },
  { keywords: ["coffee"], categoryTH: "กาแฟ", hsChapter: "09", sampleHsCode: "0901.21" },
  { keywords: ["tea"], categoryTH: "ชา", hsChapter: "09", sampleHsCode: "0902.20" },
  { keywords: ["sauce", "paste", "curry"], categoryTH: "อาหารปรุงสำเร็จ/ซอส/น้ำพริก", hsChapter: "21", sampleHsCode: "2103.90" },
  { keywords: ["cracker", "snack", "noodle", "roll"], categoryTH: "ขนม/ของทานเล่นแปรรูป", hsChapter: "19", sampleHsCode: "1905.90" },
  { keywords: ["fish", "shrimp"], categoryTH: "อาหารทะเล/กะปิ", hsChapter: "16", sampleHsCode: "1605.40" },
  { keywords: ["fruit", "canned"], categoryTH: "ผลไม้กระป๋อง/แปรรูป", hsChapter: "20", sampleHsCode: "2008.99" },
  { keywords: ["honey"], categoryTH: "น้ำผึ้ง", hsChapter: "04", sampleHsCode: "0409.00" },
  { keywords: ["oil"], categoryTH: "น้ำมันพืช", hsChapter: "15", sampleHsCode: "1513.11" },
  { keywords: ["cotton", "fabric", "textile"], categoryTH: "สิ่งทอ/ผ้า", hsChapter: "52", sampleHsCode: "5208.11" },
  { keywords: ["t-shirt", "garment", "shirt"], categoryTH: "เครื่องนุ่งห่ม", hsChapter: "61", sampleHsCode: "6109.10" },
  { keywords: ["ceramic"], categoryTH: "เครื่องเซรามิก", hsChapter: "69", sampleHsCode: "6912.00" },
  { keywords: ["rattan", "bag", "basket", "woven"], categoryTH: "เครื่องหวาย/จักสาน", hsChapter: "46", sampleHsCode: "4602.19" },
  { keywords: ["wood", "furniture", "teak"], categoryTH: "เฟอร์นิเจอร์ไม้", hsChapter: "94", sampleHsCode: "9403.60" },
  { keywords: ["soap"], categoryTH: "สบู่/เครื่องสำอาง", hsChapter: "34", sampleHsCode: "3401.11" },
];

function suggestHsCode(item) {
  if (item.hsCode) return { status: "confirmed", hsCode: item.hsCode, candidates: [] };
  const desc = `${item.productNameEN || ""} ${item.productNameTH || ""}`.toLowerCase();
  const matches = HS_CATEGORY_TABLE.filter((r) => r.keywords.some((k) => desc.includes(k)));
  if (!matches.length) return {
    status: "need_more_info", candidates: [],
    message: "ไม่พบคำที่จัดหมวดหมู่ได้ ต้องขอรายละเอียดสินค้าเพิ่มเติมก่อนแนะนำ HS code",
  };
  return {
    status: "suggested",
    candidates: matches.slice(0, 2).map((m) => ({ categoryTH: m.categoryTH, hsChapter: m.hsChapter, sampleHsCode: m.sampleHsCode })),
    message: `แนะนำเบื้องต้น: เข้าข่ายหมวด "${matches[0].categoryTH}" (Chapter ${matches[0].hsChapter}) — ควรยืนยันกับผู้เชี่ยวชาญศุลกากรก่อนยื่นจริง`,
  };
}

function getMissingDocumentsChecklist(s) {
  const coo = s.certificateOfOrigin, permit = s.permitsOrCertificates;
  return [
    { docType: "Purchase Order", status: s.po?.poNumber ? "present" : "missing" },
    { docType: "Commercial Invoice", status: s.invoice?.invoiceNo ? "present" : "missing" },
    { docType: "Packing List", status: (s.packingList?.items?.length || 0) > 0 ? "present" : "missing" },
    { docType: `${s.billOfLading?.type || "B/L"} Number`, status: s.billOfLading?.number ? "present" : "missing" },
    { docType: "Certificate of Origin", status: !coo?.required ? "not_required" : coo?.provided ? "present" : "missing" },
    { docType: permit?.type || "Permit / Product Certificate", status: !permit?.required ? "not_required" : permit?.provided ? "present" : "missing" },
  ];
}

function generateDecisionAlternatives(s) {
  const findings = runAllChecks(s);
  const high = findings.filter((f) => f.severity === "high");
  const allDelay = findings.length ? Math.max(...findings.map((f) => f.estimatedDelayDays)) : 0;
  const highDelay = high.length ? Math.max(...high.map((f) => f.estimatedDelayDays)) : 0;
  const { score, daysAvailable } = calculateRisk(s);

  const alts = [
    { id: "hold_fix_all", nameTH: "หยุดและแก้ไขเอกสารให้ครบก่อนส่ง", delayDays: allDelay,
      extraCostUSD: findings.length * 120 + allDelay * 80, residualRiskScore: findings.length ? 5 : 0,
      summary: "ปลอดภัยที่สุด ผ่านศุลกากรมั่นใจสุด แต่ใช้เวลาและมีค่าใช้จ่ายเพิ่มขึ้น" },
    { id: "ship_as_is", nameTH: "ส่งตามกำหนดเดิม (รับความเสี่ยงเอง)", delayDays: 0, extraCostUSD: 0,
      expectedPenaltyUSD: Math.round(score * 30), residualRiskScore: score,
      summary: "เร็วที่สุด ไม่หน่วงเวลา แต่มีความเสี่ยงถูกกักตรวจหรือถูกปรับที่ศุลกากร" },
    { id: "partial_fix_expedite", nameTH: "แก้เฉพาะจุดเสี่ยงสูงก่อน + เร่งเอกสาร", delayDays: highDelay,
      extraCostUSD: high.length * 120 + 300, residualRiskScore: Math.max(0, score - high.length * 25),
      summary: "จุดกึ่งกลาง แก้ปัญหาความเสี่ยงสูงก่อน ส่วนที่เหลือยอมรับไว้ก่อน มีค่าใช้จ่ายเร่งเอกสารเพิ่ม" },
  ];

  let recommendedId;
  if (!findings.length) recommendedId = "ship_as_is";
  else if (daysAvailable >= allDelay) recommendedId = "hold_fix_all";
  else if (high.length > 0 && daysAvailable >= highDelay) recommendedId = "partial_fix_expedite";
  else recommendedId = "ship_as_is";

  return { alternatives: alts, recommendedId, daysAvailable };
}

function analyzeShipment(s) {
  const findings = runAllChecks(s);
  const completeness = calculateCompleteness(s);
  const { score, level } = calculateRisk(s);
  const delayDays = findings.length ? Math.max(...findings.map((f) => f.estimatedDelayDays)) : 0;
  const missingDocumentsChecklist = getMissingDocumentsChecklist(s);
  const hsCodeSuggestions = (s.invoice?.items || []).map((item) => ({ productNameTH: item.productNameTH, productNameEN: item.productNameEN, ...suggestHsCode(item) }));
  const decision = generateDecisionAlternatives(s);
  return {
    completeness, riskScore: score, riskLevel: level, customsReadinessScore: Math.max(0, 100 - score),
    estimatedDelayDays: delayDays, findings, missingDocumentsChecklist, hsCodeSuggestions,
    decisionAlternatives: decision.alternatives, recommendedAlternativeId: decision.recommendedId, daysAvailable: decision.daysAvailable,
  };
}

/* ============================================================
   UI helpers
   ============================================================ */
function cloneShipment(s) { return JSON.parse(JSON.stringify(s)); }

function translateTH(thText) {
  const hit = PRODUCT_TRANSLATIONS.find((p) => p.th === thText);
  return hit ? hit.en : null;
}

function nextShipmentId(shipments) {
  const nums = shipments.map((s) => parseInt(s.id.replace("SHP-", ""), 10)).filter((n) => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `SHP-${String(next).padStart(3, "0")}`;
}

const RISK_COLOR = { low: "var(--green)", medium: "var(--amber)", high: "var(--red)" };
const RISK_LABEL_TH = { low: "ต่ำ", medium: "กลาง", high: "สูง" };
const STAMP_LABEL = { low: "CLEARED", medium: "REVIEW", high: "HOLD" };

/* ============================================================
   Small building-block components
   ============================================================ */
function StampBadge({ level, score, size = "sm" }) {
  const color = RISK_COLOR[level] || "var(--text-dim)";
  const dim = size === "lg" ? 92 : 56;
  const fontBig = size === "lg" ? 22 : 14;
  const fontSmall = size === "lg" ? 10 : 7;
  return (
    <div
      className="stamp"
      style={{ width: dim, height: dim, borderColor: color, color }}
      title={`Customs stamp: ${STAMP_LABEL[level]}`}
    >
      <div className="stampRing" style={{ borderColor: color }} />
      <div style={{ fontSize: fontBig, fontFamily: "var(--mono)", fontWeight: 700, lineHeight: 1 }}>{score}</div>
      <div style={{ fontSize: fontSmall, letterSpacing: "0.12em" }}>{STAMP_LABEL[level]}</div>
    </div>
  );
}

function ProgressBar({ value, color }) {
  return (
    <div className="progressTrack">
      <div className="progressFill" style={{ width: `${value}%`, background: color || "var(--green)" }} />
    </div>
  );
}

function Panel({ eyebrow, title, icon, children, right }) {
  return (
    <section className="panel">
      <div className="panelHead">
        <div>
          <div className="eyebrow">{eyebrow}</div>
          <h3 className="panelTitle">{icon}{title}</h3>
        </div>
        {right}
      </div>
      <div className="panelBody">{children}</div>
    </section>
  );
}

function MissingDocsSummary({ checklist }) {
  const missing = checklist.filter((d) => d.status === "missing");
  const others = checklist.filter((d) => d.status !== "missing");

  return (
    <div>
      <div className={missing.length ? "missingSummary missingSummaryBad" : "missingSummary missingSummaryOk"}>
        {missing.length ? <XCircle size={15} /> : <CheckCircle2 size={15} />}
        {missing.length ? `ขาด ${missing.length} รายการ` : "เอกสารครบถ้วน — ไม่มีรายการที่ขาด"}
      </div>

      {missing.map((d) => (
        <div key={d.docType} className="checkRow">
          <XCircle size={14} color="var(--red)" />
          <span className="strong">{d.docType}</span>
        </div>
      ))}

      {others.length > 0 && (
        <details className="docDetails">
          <summary>ดูเอกสารที่มีแล้ว / ไม่บังคับ ({others.length})</summary>
          {others.map((d) => (
            <div key={d.docType} className="checkRow">
              {d.status === "present" && <CheckCircle2 size={14} color="var(--green)" />}
              {d.status === "not_required" && <span className="dot" />}
              <span className="dim">{d.docType}</span>
              {d.status === "not_required" && <span className="dim small">(ไม่บังคับ)</span>}
            </div>
          ))}
        </details>
      )}
    </div>
  );
}

function ScenarioBadge({ type }) {
  const map = {
    normal: { label: "ปกติ", cls: "badgeGreen" },
    urgent: { label: "ฉุกเฉิน", cls: "badgeRed" },
    incomplete: { label: "ข้อมูลไม่ครบ", cls: "badgeAmber" },
  };
  const m = map[type] || map.normal;
  return <span className={`badge ${m.cls}`}>{m.label}</span>;
}

function DecisionStatusBadge({ status }) {
  const map = {
    pending: { label: "รอการตัดสินใจ", cls: "badgeMuted", icon: <Clock size={12} /> },
    accepted: { label: "ยอมรับแล้ว", cls: "badgeGreen", icon: <ThumbsUp size={12} /> },
    rejected: { label: "ปฏิเสธแล้ว", cls: "badgeRed", icon: <ThumbsDown size={12} /> },
    modified: { label: "แก้ไขเอง", cls: "badgeAmber", icon: <Pencil size={12} /> },
  };
  const m = map[status] || map.pending;
  return <span className={`badge ${m.cls}`} style={{ display: "inline-flex", gap: 4, alignItems: "center" }}>{m.icon}{m.label}</span>;
}

/* ============================================================
   Overview (list) view
   ============================================================ */
function Overview({ shipments, analyses, onOpen, onNew, search, setSearch, riskFilter, setRiskFilter, scenarioFilter, setScenarioFilter }) {
  const rows = shipments
    .map((s, i) => ({ s, a: analyses[i] }))
    .filter(({ s }) => (search ? (s.id + s.destinationCountry + (s.po?.buyer || "")).toLowerCase().includes(search.toLowerCase()) : true))
    .filter(({ a }) => (riskFilter === "all" ? true : a.riskLevel === riskFilter))
    .filter(({ s }) => (scenarioFilter === "all" ? true : s.scenarioType === scenarioFilter));

  const avgCompleteness = Math.round(analyses.reduce((sum, a) => sum + a.completeness, 0) / analyses.length);
  const highRiskCount = analyses.filter((a) => a.riskLevel === "high").length;
  const totalDelay = analyses.reduce((sum, a) => sum + a.estimatedDelayDays, 0);
  const readyCount = analyses.filter((a) => a.findings.length === 0).length;

  return (
    <div>
      <div className="kpiRow">
        <div className="kpiCard">
          <div className="kpiLabel">ชิปเมนต์ทั้งหมด</div>
          <div className="kpiValue">{shipments.length}</div>
          <div className="kpiSub">{readyCount} รายการพร้อมส่งออกทันที</div>
        </div>
        <div className="kpiCard">
          <div className="kpiLabel">ความสมบูรณ์เอกสารเฉลี่ย</div>
          <div className="kpiValue">{avgCompleteness}%</div>
          <div className="kpiSub">เฉลี่ยทั้งหมด 30 ชิปเมนต์</div>
        </div>
        <div className="kpiCard" style={{ borderColor: highRiskCount > 0 ? "var(--red)" : "var(--line)" }}>
          <div className="kpiLabel">ชิปเมนต์ความเสี่ยงสูง</div>
          <div className="kpiValue" style={{ color: highRiskCount > 0 ? "var(--red)" : "var(--text)" }}>{highRiskCount}</div>
          <div className="kpiSub">ต้องดำเนินการก่อน</div>
        </div>
        <div className="kpiCard">
          <div className="kpiLabel">ความล่าช้าสะสมที่อาจเกิดขึ้น</div>
          <div className="kpiValue">{totalDelay}<span style={{ fontSize: 14, marginLeft: 4 }}>วัน</span></div>
          <div className="kpiSub">ถ้าไม่แก้ปัญหาที่พบเลย</div>
        </div>
      </div>

      <div className="toolbar">
        <div className="searchBox">
          <Search size={15} color="var(--text-dim)" />
          <input placeholder="ค้นหา ID / ประเทศ / ผู้ซื้อ" value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
        <select value={riskFilter} onChange={(e) => setRiskFilter(e.target.value)}>
          <option value="all">ทุกระดับความเสี่ยง</option>
          <option value="low">ความเสี่ยงต่ำ</option>
          <option value="medium">ความเสี่ยงกลาง</option>
          <option value="high">ความเสี่ยงสูง</option>
        </select>
        <select value={scenarioFilter} onChange={(e) => setScenarioFilter(e.target.value)}>
          <option value="all">ทุกสถานการณ์</option>
          <option value="normal">ปกติ</option>
          <option value="urgent">ฉุกเฉิน</option>
          <option value="incomplete">ข้อมูลไม่ครบ</option>
        </select>
        <button className="btnPrimary" onClick={onNew}><PlusCircle size={15} /> เพิ่มชิปเมนต์ใหม่</button>
      </div>

      <div className="tableWrap">
        <table>
          <thead>
            <tr>
              <th></th><th>Shipment</th><th>ปลายทาง</th><th>สถานการณ์</th><th>ความสมบูรณ์</th>

}

/* ============================================================
   Shared OCR / document-extraction hook (Claude API)
   ============================================================ */
const OCR_MAX_BYTES = 10 * 1024 * 1024; // 10MB
const OCR_INSTRUCTION = "อ่านเอกสารส่งออก (เช่น commercial invoice, packing list, purchase order, bill of lading, certificate of origin) ในไฟล์นี้ แล้วดึงข้อมูลออกมาเป็น JSON เท่านั้น ห้ามมีข้อความอื่น ห้ามมี markdown code fence ใช้ null สำหรับข้อมูลที่ไม่พบในเอกสาร ห้ามเดาตัวเลขที่ไม่มีในเอกสาร โครงสร้างที่ต้องตอบกลับคือ: "
  + '{"buyer":string|null,"poNumber":string|null,"invoiceNo":string|null,"productNameEN":string|null,"productNameTH":string|null,"hsCode":string|null,"qty":number|null,"unit":string|null,"unitPrice":number|null,"grossWeightKg":number|null,"netWeightKg":number|null,"incoterm":string|null,"destinationCountry":string|null,"blType":"B/L or AWB or null","blNumber":string|null,"carrier":string|null,"cooProvided":true false or null,"deadline":"YYYY-MM-DD or null"}';

function useDocumentOcr() {
  const [status, setStatus] = useState("idle"); // idle | extracting | success | error
  const [fileName, setFileName] = useState("");
  const [fileSizeLabel, setFileSizeLabel] = useState("");
  const [error, setError] = useState("");
  const [previewUrl, setPreviewUrl] = useState(null);
  const [previewIsPdf, setPreviewIsPdf] = useState(false);
  const [fields, setFields] = useState([]);

  function reset() {
    setStatus("idle"); setFileName(""); setFileSizeLabel(""); setError(""); setPreviewUrl(null); setPreviewIsPdf(false); setFields([]);
  }

  async function runExtraction(file, onExtracted) {
    setFileName(file.name);
    setFileSizeLabel(`${(file.size / 1024 / 1024).toFixed(1)} MB`);
    setError(""); setFields([]);

    if (file.size > OCR_MAX_BYTES) {
      setStatus("error");
      setError(`ไฟล์ใหญ่เกินไป (${(file.size / 1024 / 1024).toFixed(1)} MB) — รองรับไม่เกิน 10 MB`);
      return;
    }

    setStatus("extracting");
    try {
      const base64Data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
        reader.readAsDataURL(file);
      });
      const isPdf = file.type === "application/pdf";
      setPreviewIsPdf(isPdf);
      setPreviewUrl(isPdf ? null : `data:${file.type || "image/jpeg"};base64,${base64Data}`);

      const contentBlock = isPdf
        ? { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64Data } }
        : { type: "image", source: { type: "base64", media_type: file.type || "image/jpeg", data: base64Data } };

      const response = await fetch("/api/ocr", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 1000,
          messages: [{ role: "user", content: [contentBlock, { type: "text", text: OCR_INSTRUCTION }] }],
        }),
      });
      if (!response.ok) throw new Error(`API error ${response.status}`);
      const data = await response.json();
      const textOut = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
      const cleaned = textOut.replace(/```json|```/g, "").trim();
      const extracted = JSON.parse(cleaned);
      const filled = onExtracted(extracted) || [];
      setFields(filled);
      setStatus("success");
    } catch (err) {
      setStatus("error");
      setError("อ่านเอกสารด้วย AI ไม่สำเร็จ กรุณากรอกข้อมูลด้วยตนเอง หรือลองอัปโหลดไฟล์ใหม่อีกครั้ง");
    }
  }

  return { status, fileName, fileSizeLabel, error, previewUrl, previewIsPdf, fields, runExtraction, reset };
}

function OcrStatusBanner({ ocr }) {
  return (
    <>
      {ocr.status === "extracting" && (
        <div className="ocrBanner ocrBannerBusy"><Loader2 size={14} className="spin" /> กำลังอ่าน "{ocr.fileName}" ด้วย AI...</div>
      )}
      {ocr.status === "success" && (
        <div className="ocrBanner ocrBannerOk">
          <CheckCircle2 size={14} /> อ่าน "{ocr.fileName}" สำเร็จ — เติมข้อมูลอัตโนมัติ {ocr.fields.length} ช่อง โปรดตรวจสอบความถูกต้องก่อนบันทึก (AI อาจอ่านผิดพลาดได้)
        </div>
      )}
      {ocr.status === "error" && (
        <div className="ocrBanner ocrBannerErr"><AlertTriangle size={14} /> {ocr.error}</div>
      )}
      {ocr.previewUrl && (
        <img src={ocr.previewUrl} alt="ตัวอย่างเอกสารที่อัปโหลด" className="ocrPreviewImg" />
      )}
      {ocr.status !== "idle" && ocr.previewIsPdf && (
        <div className="ocrPreviewPdf"><FileWarning size={14} /> {ocr.fileName} ({ocr.fileSizeLabel}) — PDF ไม่มีตัวอย่างภาพ</div>
      )}
    </>
  );
}

function DocumentUpdatePanel({ onMergeExtracted }) {
  const ocr = useDocumentOcr();
  const [docType, setDocType] = useState("invoice");

  function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    ocr.runExtraction(file, (extracted) => onMergeExtracted(extracted, docType));
    e.target.value = "";
  }

  return (
    <Panel eyebrow="AI document extraction" title="อัปโหลดเอกสารเพื่ออัปเดตชิปเมนต์นี้ (OCR)" icon={<Upload size={15} />}>
      <div className="ocrUpdateRow">

      </div>

/* ============================================================
   New shipment form
   ============================================================ */
function NewShipmentForm({ onCancel, onCreate }) {
  const [form, setForm] = useState({
    destinationCountry: "China", incoterm: "FOB", costResponsibility: "buyer_pays_freight",
    buyer: "", poNumber: "", invoiceNo: "", productNameTH: "", productNameEN: "", hsCode: "",
    qty: 100, unit: "kg", unitPrice: 1, grossWeightKg: 100, netWeightKg: 95,
    blType: "B/L", blNumber: "", carrier: "", cooRequired: true, cooProvided: true,
    permitRequired: false, permitProvided: false, permitType: "", responsibleParty: "",
    deadline: "", createdAt: new Date().toISOString().slice(0, 10),
  });
  const ocr = useDocumentOcr();

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  function applyExtracted(ex) {
    const filled = [];
    setForm((f) => {
      const next = { ...f };
      const maybe = (key, val, valid = true) => { if (val !== null && val !== undefined && val !== "" && valid) { next[key] = val; filled.push(key); } };
      maybe("buyer", ex.buyer);
      maybe("poNumber", ex.poNumber);
      maybe("invoiceNo", ex.invoiceNo);
      maybe("productNameEN", ex.productNameEN);
      maybe("productNameTH", ex.productNameTH);
      maybe("hsCode", ex.hsCode);
      maybe("qty", ex.qty, typeof ex.qty === "number");
      maybe("unit", ex.unit);
      maybe("unitPrice", ex.unitPrice, typeof ex.unitPrice === "number");
      maybe("grossWeightKg", ex.grossWeightKg, typeof ex.grossWeightKg === "number");
      maybe("netWeightKg", ex.netWeightKg, typeof ex.netWeightKg === "number");
      maybe("incoterm", ex.incoterm, !!INCOTERM_EXPECTED_RESPONSIBILITY[ex.incoterm]);
      maybe("destinationCountry", ex.destinationCountry, !!COUNTRY_CHECKLIST[ex.destinationCountry]);
      maybe("blType", ex.blType, ex.blType === "B/L" || ex.blType === "AWB");
      maybe("blNumber", ex.blNumber);
      maybe("carrier", ex.carrier);
      maybe("cooProvided", ex.cooProvided, typeof ex.cooProvided === "boolean");
      maybe("deadline", ex.deadline);
      return next;
    });
    return filled;
  }

  function handleFileUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    ocr.runExtraction(file, applyExtracted);
    e.target.value = "";
  }

  function submit() {
    const shipment = {
      id: "", destinationCountry: form.destinationCountry, scenarioType: "normal",
      createdAt: form.createdAt, deadline: form.deadline || form.createdAt,
      incoterm: form.incoterm, costResponsibility: form.costResponsibility, responsibleParty: form.responsibleParty,
      po: { poNumber: form.poNumber || null, buyer: form.buyer },
      invoice: { invoiceNo: form.invoiceNo, currency: "USD", items: [{ productNameTH: form.productNameTH, productNameEN: form.productNameEN, hsCode: form.hsCode || null, qty: Number(form.qty), unit: form.unit, unitPrice: Number(form.unitPrice) }] },
      packingList: { items: [{ productNameTH: form.productNameTH, qty: Number(form.qty), grossWeightKg: Number(form.grossWeightKg), netWeightKg: Number(form.netWeightKg) }] },
      billOfLading: { type: form.blType, number: form.blNumber || null, carrier: form.carrier || null },
      certificateOfOrigin: { required: form.cooRequired, provided: form.cooProvided, number: form.cooProvided ? "COO-NEW" : null },
      permitsOrCertificates: { required: form.permitRequired, provided: form.permitProvided, type: form.permitType || null },
    };
    onCreate(shipment);
  }

  return (
    <div>

      <Panel eyebrow="Data intake · AI document extraction" title="อัปโหลดเอกสาร (Invoice / Packing List / PO) ให้ AI อ่านให้อัตโนมัติ" icon={<Upload size={15} />}>
        <label className="uploadBox" htmlFor="ocrFileInput">
          <Upload size={18} />
          <div>
            <div className="strong small">คลิกเพื่อเลือกไฟล์ภาพหรือ PDF</div>
            <div className="dim small">รองรับ JPG, PNG, PDF (ไม่เกิน 10MB) — ระบบจะดึงข้อมูลมาเติมในฟอร์มด้านล่างให้อัตโนมัติ</div>
          </div>
        </label>
        <input id="ocrFileInput" type="file" accept="image/*,application/pdf" style={{ display: "none" }} onChange={handleFileUpload} />
        <OcrStatusBanner ocr={ocr} />
      </Panel>

      <Panel eyebrow="Data intake · Manual" title="ตรวจสอบ / กรอกข้อมูลชิปเมนต์" icon={<PlusCircle size={15} />}>
        <div className="formGrid">
          <label>ประเทศปลายทาง<select value={form.destinationCountry} onChange={(e) => set("destinationCountry", e.target.value)}>{Object.keys(COUNTRY_CHECKLIST).map((c) => <option key={c}>{c}</option>)}</select></label>
          <label>Incoterm<select value={form.incoterm} onChange={(e) => set("incoterm", e.target.value)}>{Object.keys(INCOTERM_EXPECTED_RESPONSIBILITY).map((k) => <option key={k}>{k}</option>)}</select></label>
          <label>ผู้รับผิดชอบค่าขนส่ง<select value={form.costResponsibility} onChange={(e) => set("costResponsibility", e.target.value)}><option value="buyer_pays_freight">ผู้ซื้อจ่าย</option><option value="seller_pays_freight_insurance">ผู้ขายจ่าย</option></select></label>
          <label>ผู้ซื้อ (Buyer)<input value={form.buyer} onChange={(e) => set("buyer", e.target.value)} /></label>

          <label>เลข Invoice<input value={form.invoiceNo} onChange={(e) => set("invoiceNo", e.target.value)} /></label>
          <label>ชื่อสินค้า (ไทย)<input value={form.productNameTH} onChange={(e) => set("productNameTH", e.target.value)} /></label>
          <label>ชื่อสินค้า (อังกฤษ)<input value={form.productNameEN} onChange={(e) => set("productNameEN", e.target.value)} /></label>
          <label>HS code (ปล่อยว่างได้ถ้าไม่แน่ใจ)<input value={form.hsCode} onChange={(e) => set("hsCode", e.target.value)} /></label>
          <label>จำนวน (Invoice = Packing)<input type="number" value={form.qty} onChange={(e) => set("qty", e.target.value)} /></label>
          <label>Gross weight (kg)<input type="number" value={form.grossWeightKg} onChange={(e) => set("grossWeightKg", e.target.value)} /></label>
          <label>Net weight (kg)<input type="number" value={form.netWeightKg} onChange={(e) => set("netWeightKg", e.target.value)} /></label>
          <label>ประเภท B/L<select value={form.blType} onChange={(e) => set("blType", e.target.value)}><option>B/L</option><option>AWB</option></select></label>
          <label>เลข B/L / AWB<input value={form.blNumber} onChange={(e) => set("blNumber", e.target.value)} /></label>
          <label>สายเรือ/สายการบิน<input value={form.carrier} onChange={(e) => set("carrier", e.target.value)} /></label>
          <label>ผู้รับผิดชอบชิปเมนต์<input value={form.responsibleParty} onChange={(e) => set("responsibleParty", e.target.value)} /></label>
          <label>กำหนดปิดตู้ (deadline)<input type="date" value={form.deadline} onChange={(e) => set("deadline", e.target.value)} /></label>
          <label className="checkboxLabel"><input type="checkbox" checked={form.cooRequired} onChange={(e) => set("cooRequired", e.target.checked)} /> ต้องมี Certificate of Origin</label>
          <label className="checkboxLabel"><input type="checkbox" checked={form.cooProvided} onChange={(e) => set("cooProvided", e.target.checked)} /> มี Certificate of Origin แล้ว</label>

/* ============================================================
   Root App
   ============================================================ */
function App() {
  const [shipments, setShipments] = useState(() => {
    try {
      const saved = localStorage.getItem("tradeready_shipments");
      return saved ? JSON.parse(saved) : RAW_SHIPMENTS;
    } catch { return RAW_SHIPMENTS; }
  });
  const [view, setView] = useState("list");
  const [selectedId, setSelectedId] = useState(null);
  const [search, setSearch] = useState("");
  const [riskFilter, setRiskFilter] = useState("all");
  const [scenarioFilter, setScenarioFilter] = useState("all");
  const [decisions, setDecisions] = useState(() => {
    try {
      const saved = localStorage.getItem("tradeready_decisions");
      return saved ? JSON.parse(saved) : {};
    } catch { return {}; }
  });
  const [whatIfDraft, setWhatIfDraft] = useState(null);

  const analyses = useMemo(() => shipments.map((s) => analyzeShipment(s)), [shipments]);

  useEffect(() => {
    try { localStorage.setItem("tradeready_shipments", JSON.stringify(shipments)); } catch {}
  }, [shipments]);

  useEffect(() => {
    try { localStorage.setItem("tradeready_decisions", JSON.stringify(decisions)); } catch {}
  }, [decisions]);
  const selectedShipment = shipments.find((s) => s.id === selectedId) || null;
  const selectedAnalysis = selectedShipment ? analyzeShipment(selectedShipment) : null;

  function openDetail(id) {
    const s = shipments.find((sh) => sh.id === id);
    if (!s) return;
    const a = analyzeShipment(s);
    setSelectedId(id);
    setWhatIfDraft(cloneShipment(s));
    setDecisions((prev) => prev[id] ? prev : { ...prev, [id]: { chosenId: a.recommendedAlternativeId, status: "pending", note: "" } });
    setView("detail");
  }

  function selectAlt(altId) {
    setDecisions((prev) => ({ ...prev, [selectedId]: { ...prev[selectedId], chosenId: altId, status: "pending" } }));
  }

  function decisionAction(status, note) {
    setDecisions((prev) => ({ ...prev, [selectedId]: { ...prev[selectedId], status, note: note !== undefined ? note : prev[selectedId]?.note || "" } }));
  }

  function whatIfChange(field, value) {
    setWhatIfDraft((prev) => {
      const d = cloneShipment(prev);
      if (field === "incoterm") d.incoterm = value;
      if (field === "costResponsibility") d.costResponsibility = value;
      if (field === "invoiceQty") d.invoice.items[0].qty = value;
      if (field === "packingQty") d.packingList.items[0].qty = value;
      if (field === "grossWeight") d.packingList.items[0].grossWeightKg = value;
      if (field === "netWeight") d.packingList.items[0].netWeightKg = value;
      if (field === "cooProvided") d.certificateOfOrigin.provided = value;
      if (field === "permitProvided") d.permitsOrCertificates.provided = value;
      return d;
    });
  }

  function applyWhatIf() {
    if (!whatIfDraft) return;
    setShipments((prev) => prev.map((s) => (s.id === selectedId ? whatIfDraft : s)));
    const newRecommended = analyzeShipment(whatIfDraft).recommendedAlternativeId;
    setDecisions((prev) => ({ ...prev, [selectedId]: { chosenId: newRecommended, status: "pending", note: "" } }));
  }

  function resetWhatIf() {
    const s = shipments.find((sh) => sh.id === selectedId);
    if (s) setWhatIfDraft(cloneShipment(s));
  }

  function mergeExtractedIntoWhatIf(extracted, docType) {
    const filled = [];
    setWhatIfDraft((prev) => {
      const d = cloneShipment(prev);
      const maybe = (setter, val, valid = true) => {
        if (val !== null && val !== undefined && val !== "" && valid) { setter(val); filled.push(true); }
      };
      if (docType === "invoice") {
        maybe((v) => (d.invoice.invoiceNo = v), extracted.invoiceNo);
        maybe((v) => (d.po.poNumber = v), extracted.poNumber);
        maybe((v) => (d.po.buyer = v), extracted.buyer);
        maybe((v) => (d.invoice.items[0].productNameEN = v), extracted.productNameEN);
        maybe((v) => (d.invoice.items[0].productNameTH = v), extracted.productNameTH);
        maybe((v) => (d.invoice.items[0].hsCode = v), extracted.hsCode);
        maybe((v) => (d.invoice.items[0].qty = v), extracted.qty, typeof extracted.qty === "number");
        maybe((v) => (d.invoice.items[0].unit = v), extracted.unit);
        maybe((v) => (d.invoice.items[0].unitPrice = v), extracted.unitPrice, typeof extracted.unitPrice === "number");
        maybe((v) => (d.incoterm = v), extracted.incoterm, !!INCOTERM_EXPECTED_RESPONSIBILITY[extracted.incoterm]);
        maybe((v) => (d.deadline = v), extracted.deadline);
      } else if (docType === "packing_list") {
        maybe((v) => (d.packingList.items[0].productNameTH = v), extracted.productNameTH);
        maybe((v) => (d.packingList.items[0].qty = v), extracted.qty, typeof extracted.qty === "number");
        maybe((v) => (d.packingList.items[0].grossWeightKg = v), extracted.grossWeightKg, typeof extracted.grossWeightKg === "number");
        maybe((v) => (d.packingList.items[0].netWeightKg = v), extracted.netWeightKg, typeof extracted.netWeightKg === "number");
      } else if (docType === "bl_awb") {
        maybe((v) => (d.billOfLading.type = v), extracted.blType, extracted.blType === "B/L" || extracted.blType === "AWB");
        maybe((v) => (d.billOfLading.number = v), extracted.blNumber);
        maybe((v) => (d.billOfLading.carrier = v), extracted.carrier);
      } else if (docType === "coo") {
        d.certificateOfOrigin.provided = true; filled.push(true);
      } else if (docType === "permit" && d.permitsOrCertificates) {
        d.permitsOrCertificates.provided = true; filled.push(true);
      } else {
        maybe((v) => (d.po.poNumber = v), extracted.poNumber);
        maybe((v) => (d.po.buyer = v), extracted.buyer);
        maybe((v) => (d.invoice.invoiceNo = v), extracted.invoiceNo);
        maybe((v) => (d.invoice.items[0].qty = v), extracted.qty, typeof extracted.qty === "number");
        maybe((v) => (d.packingList.items[0].qty = v), extracted.qty, typeof extracted.qty === "number");
        maybe((v) => (d.incoterm = v), extracted.incoterm, !!INCOTERM_EXPECTED_RESPONSIBILITY[extracted.incoterm]);
        maybe((v) => (d.deadline = v), extracted.deadline);
      }
      return d;
    });
    return filled;
  }

  function createShipment(partial) {
    const id = nextShipmentId(shipments);
    const s = { ...partial, id };
    setShipments((prev) => [...prev, s]);
    openDetail(id);
  }

        .highlightVal { color: var(--amber); }

        .tagWrap { display:flex; gap: 6px; flex-wrap: wrap; }
        .tag { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--text-dim); }

        .assumptionList { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-dim); display:flex; flex-direction:column; gap: 6px; }

        .formGrid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .formGrid label { display:flex; flex-direction:column; gap:4px; font-size: 12px; color: var(--text-dim); }
        @media (max-width: 800px) { .formGrid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 520px) { .formGrid { grid-template-columns: 1fr; } }

        .uploadBox { display:flex; align-items:center; gap: 12px; border: 1px dashed var(--line); border-radius: 8px; padding: 16px; cursor: pointer; background: var(--panel-2); }
        .uploadBox:hover { border-color: var(--amber); }
        .uploadBoxCompact { padding: 9px 14px; flex: 1; }
        .ocrUpdateRow { display:flex; gap: 10px; align-items:stretch; flex-wrap: wrap; }
        .ocrUpdateRow select { min-width: 190px; }
        .ocrBanner { margin-top: 10px; border-radius: 6px; padding: 8px 10px; font-size: 12px; display:flex; gap:8px; align-items:flex-start; }
        .ocrBannerBusy { background: var(--panel-2); color: var(--text-dim); }
        .ocrBannerOk { background: rgba(42,157,143,0.10); color: #14524A; border: 1px solid var(--green); }
        .ocrBannerErr { background: rgba(193,80,46,0.08); color: #7A3218; border: 1px solid var(--red); }
        .ocrPreviewImg { display:block; max-width: 220px; max-height: 160px; margin-top: 10px; border-radius: 6px; border: 1px solid var(--line); object-fit: contain; background: var(--panel-2); }
        .ocrPreviewPdf { display:flex; gap:6px; align-items:center; margin-top: 8px; font-size: 12px; color: var(--text-dim); }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      `}</style>

      <div className="topBar">
        <div className="brand">
          <div className="eyebrow">Export Documentation & Customs Readiness</div>
          <div className="brandTitle">TradeReady AI</div>
          <div className="brandSub">ผู้ช่วย SME ไทยตรวจสอบความพร้อมเอกสารก่อนส่งออก</div>
        </div>
      </div>
      <div className="disclaimerBar">
        <Info size={14} style={{ marginTop: 1 }} />
        <div><b>คำเตือน:</b> ผลลัพธ์ทั้งหมดในระบบนี้เป็นคำแนะนำจาก AI เท่านั้น ไม่ถือเป็นการตัดสินใจทางกฎหมายหรือทางศุลกากรที่เป็นทางการ ผู้ใช้งานเป็นผู้ตัดสินใจสุดท้ายเสมอ</div>
      </div>

      {view === "list" && (
        <Overview
          shipments={shipments} analyses={analyses} onOpen={openDetail} onNew={() => setView("new")}
          search={search} setSearch={setSearch} riskFilter={riskFilter} setRiskFilter={setRiskFilter}
          scenarioFilter={scenarioFilter} setScenarioFilter={setScenarioFilter}
        />
      )}

      {view === "detail" && selectedShipment && (
        <DetailView
          shipment={selectedShipment} analysis={selectedAnalysis} onBack={() => setView("list")}
          decision={decisions[selectedId] || { chosenId: null, status: "pending", note: "" }}
          onSelectAlt={selectAlt} onDecisionAction={decisionAction}
          whatIfDraft={whatIfDraft} onWhatIfChange={whatIfChange} onApplyWhatIf={applyWhatIf} onResetWhatIf={resetWhatIf}
          onMergeExtracted={mergeExtractedIntoWhatIf}
        />
      )}

      {view === "new" && <NewShipmentForm onCancel={() => setView("list")} onCreate={createShipment} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
